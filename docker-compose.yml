
services:
  # ----------------------------
  # PostgreSQL Database
  # ----------------------------
  postgres:
    image: postgres:15-alpine
    container_name: youtube_summarizer_db
    restart: unless-stopped
    # Credentials come from backend/.env, so the backend and the database always agree:
    #   docker compose --env-file backend/.env up --build
    environment:
      POSTGRES_USER: ${DB_USER:?run with --env-file backend/.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?run with --env-file backend/.env}
      POSTGRES_DB: ${DB_NAME:?run with --env-file backend/.env}
    # No published port: only the backend reaches it, over app-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  # ----------------------------
  # Backend Service (FastAPI)
  # ----------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: youtube_summarizer_backend
    restart: unless-stopped
    # Bound to localhost: in production put a TLS reverse proxy (nginx, Caddy) in front of it
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # backend/.env says localhost for running natively; in compose the database is the postgres service
      DB_HOST: postgres
      DB_PORT: "5432"
      # Only the host's reverse proxy can reach port 8000, so trust its X-Forwarded-For (real client IPs for the rate limit)
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_cache:/root/.cache
    networks:
      - app-network

volumes:
  postgres_data:
  backend_cache:

networks:
  app-network:
    driver: bridge